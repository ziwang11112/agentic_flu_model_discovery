seed: 4242

data:
  raw_csv: data/raw/National_extract_V1_3.csv
  processed_dir: data/processed_dengue
  min_weeks: 156
  log1p_transform: false
  series:
    - country: Nicaragua
      case_definition: Total
    - country: Colombia
      case_definition: Total
    - country: Brazil
      case_definition: Total
    - country: Mexico
      case_definition: Total
    - country: Sri Lanka
      case_definition: Total
    - country: Taiwan
      case_definition: Total
    - country: Malaysia
      case_definition: Total
    - country: Singapore
      case_definition: Confirmed

artifacts:
  root_dir: artifacts_dengue_weekly_smoke
  report: reports/dengue_weekly_smoke_report.md

models:
  - seasonal_naive
  - deterministic_seir_like
  - probabilistic_student_t
  - constrained_structure_discovery

metrics:
  headline:
    - mae
    - rmse
    - mase
    - rolling_mae
    - log1p_mae

evaluation:
  train_fraction: 0.6
  val_fraction: 0.2
  seasonal_period: 52
  rolling_horizon: 1
  max_rolling_origins: 12

fitting:
  n_restarts: 2
  rolling_n_restarts: 0
  maxiter: 80
  negative_penalty: 10000.0
  mass_penalty: 10000.0
  prior_weight: 0.001
  laplace_draws: 50
  uncertainty_method: bootstrap
  bootstrap_draws: 10
  bootstrap_n_restarts: 0
  calibrate_intervals: false
  interval_calibration_method: conformal
  calibration_draws: 8
  calibration_scale_min: 0.25
  calibration_scale_max: 1.25
  calibration_scale_grid_size: 21

discovery:
  beam_width: 3
  max_rounds: 3
  patience: 2
  rolling_horizons:
    - 1
  multi_split_blocks: 2
  score_param_weight: 0.01
  score_compartment_weight: 0.02
  score_fractional_weight: 0.015
  score_observation_weight: 0.005
  score_delay_weight: 0.005
  score_h_observation_weight: 0.005
  score_recurrence_weight: 0.01
  score_stability_weight: 0.2
  score_multi_split_std_weight: 0.5
  raw_l2_weight: 0.0005
  seasonality_l2_weight: 0.005
  rho_l2_weight: 0.002
  init_l2_weight: 0.002
  fractional_alpha_weight: 0.002
  use_age_prior: false
  age_prior_simple_bonus: 0.01
  age_prior_recurrence_bonus: 0.01
  age_prior_fractional_bonus: 0.005
